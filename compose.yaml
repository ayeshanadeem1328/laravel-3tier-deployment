services:
  frontend:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    container_name: laravel-frontend
    ports:
      - "8081:80"
    volumes:
      - ./app:/var/www/html
    depends_on:
      - backend
    networks:
      - laravel_network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: laravel-backend
    volumes:
      - ./app:/var/www/html
      - backend_data:/var/www/html/storage
    depends_on:
      - db
    networks:
      - laravel_network

  db:
    image: mysql:8.0
    container_name: laravel-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - laravel_network

networks:
  laravel_network:
    driver: bridge

volumes:
  backend_data:
  db_data:
